<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gestão de Despesas{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Cabeçalho / Navbar responsiva com Bootstrap -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="/"><i class="fa-solid fa-wallet"></i> SplitExpenses</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="fa-solid fa-house"></i> Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-users"></i> Grupos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-receipt"></i> Despesas</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center">
                    <!-- Botão de Alternância de Tema Claro / Escuro -->
                    <li class="nav-item me-3">
                        <button class="btn btn-outline-secondary btn-sm rounded-circle" id="btn-theme-toggle" onclick="toggleTheme()" title="Alternar Tema">
                            <i class="fa-solid fa-moon" id="theme-icon"></i>
                        </button>
                    </li>
                    <li class="nav-item">
                        <!-- Botão Admin -->
                        <a class="btn btn-dark btn-sm px-3 fw-bold shadow-sm" href="/admin/">
                            <i class="fa-solid fa-user-shield text-warning me-1"></i> Admin
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Dinâmico -->
    <main class="container my-5">
        {% block conteudo %}
        {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4 border-top mt-auto bg-body-tertiary">
        <p class="text-muted mb-0">&copy; 2026 Gestão de Despesas - UFLA</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script com Persistência de Tema no LocalStorage -->
    <script>
        // Carrega o tema salvo ao iniciar a página
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('app-theme') || 'light';
            setTheme(savedTheme);
        });

        function setTheme(theme) {
            const htmlEl = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            htmlEl.setAttribute('data-bs-theme', theme);
            localStorage.setItem('app-theme', theme);
            
            if (theme === 'dark') {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        }
    </script>
</body>
</html>
